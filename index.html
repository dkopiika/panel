<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Панель СММ</title><style>:root{--bg:#f6f5fb;--fg:#15131f;--mut:#6e6a80;--card:rgba(255,255,255,.72);--line:rgba(21,19,31,.09);
--fux:#ff2bd6;--blue:#2e5bff;--lime:#9be22d;--grey:#8d8a99;--acc:#ff2bd6;
--svob:#2e5bff;--rabota:#9be22d;--utv:#ff2bd6;--vyshla:#8d8a99;--glow:radial-gradient(1200px 500px at 90% -10%,rgba(255,43,214,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(46,91,255,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(155,226,45,.14),transparent 60%)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0d14;--fg:#f2f0fa;--mut:#9d99b0;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--lime:#b8ff4a;--rabota:#b8ff4a}}
*{box-sizing:border-box}body{margin:0;background:var(--glow),var(--bg);background-attachment:fixed;color:var(--fg);font:16px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;padding:5px 12px;border-radius:99px;color:var(--fg);text-decoration:none;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
nav a.on{background:linear-gradient(90deg,var(--fux),var(--blue));color:#fff;border-color:transparent}
h1{font-size:28px;margin:.4em 0;letter-spacing:-.02em;background:linear-gradient(90deg,var(--fux),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;margin:1.4em 0 .5em;letter-spacing:-.01em}h2 small{color:var(--mut);font-weight:500}h3{font-size:17px}
a{color:var(--blue)}code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:.88em;word-break:break-all}
blockquote{margin:1em 0;padding:.7em 1em;border-left:3px solid var(--fux);background:rgba(255,43,214,.07);border-radius:0 12px 12px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
@media (max-width:640px){table thead{display:none}table tr{display:block;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:6px 12px}
table td{display:block;border:0;padding:4px 0}table td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}
.chips button.on{background:var(--fg);color:var(--bg)}
#q{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--svob)}
.card.s-rabota::before{background:var(--rabota)}.card.s-utv::before{background:var(--utv)}.card.s-vyshla{opacity:.6}.card.s-vyshla::before{background:var(--vyshla)}
.card.s-utv{background:linear-gradient(135deg,rgba(255,43,214,.12),var(--card))}
.card .num{font-size:12px;color:var(--mut)}.card .t{font-weight:700;margin:2px 0 6px}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--fg)}
.chip.s-svob{background:rgba(46,91,255,.15);color:var(--blue)}
.chip.s-rabota{background:rgba(155,226,45,.25);color:#3f6b00}
.chip.s-utv{background:rgba(255,43,214,.16);color:#d10fae}
.chip.s-vyshla{background:rgba(141,138,153,.18);color:var(--mut)}
.chip.f{background:rgba(46,91,255,.1);color:var(--blue)}.chip.net{background:rgba(255,80,80,.14);color:#e0304a}
@media (prefers-color-scheme:dark){.chip.s-rabota{color:var(--lime)}.chip.s-utv{color:#ff6ae4}.chip.s-svob,.chip.f{color:#7f9bff}}
.empty{color:var(--mut)}details{margin:10px 0}summary{cursor:pointer;font-weight:600}
details.txt{margin:10px 0 0;border-top:1px dashed var(--line);padding-top:8px}details.txt>summary{color:var(--fux)}
.nash{margin-top:6px;font-size:15px}.nash blockquote{border-left-color:var(--blue);background:rgba(46,91,255,.06)}details.razbor>summary{color:var(--mut);font-size:14px}
.node{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:14px}.node>summary{list-style:none;display:grid;grid-template-columns:38px 1fr;gap:2px 12px;align-items:center}
.node>summary::-webkit-details-marker{display:none}
.ln-n{grid-row:span 3;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--fux),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.ln-t{font-weight:800}.ln-c{font-size:13px;color:var(--mut)}.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}.bar i{display:block}
.bar i.s-svob{background:var(--svob)}.bar i.s-rabota{background:var(--rabota)}.bar i.s-utv{background:var(--utv)}.bar i.s-vyshla{background:var(--vyshla)}
.tree{list-style:none;padding:0;margin:12px 0 0;border-left:2px solid var(--line)}.tree li{padding:7px 0 7px 14px;position:relative}.tree li::before{content:"";position:absolute;left:0;top:18px;width:10px;border-top:2px solid var(--line)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.tile{display:flex;flex-direction:column;gap:4px;padding:22px;border-radius:22px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.tile:nth-child(1){background:linear-gradient(135deg,rgba(255,43,214,.18),var(--card))}.tile:nth-child(2){background:linear-gradient(135deg,rgba(46,91,255,.18),var(--card))}.tile:nth-child(3){background:linear-gradient(135deg,rgba(155,226,45,.25),var(--card))}
.tile .ic{font-size:30px}.tile small{color:var(--mut)}.sub,.upd{color:var(--mut);font-size:14px}
#lock{max-width:360px;margin:20vh auto;padding:16px;text-align:center}#lock input{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin:12px 0}
#lock button{padding:10px 20px;font-size:16px;border-radius:10px;border:0;background:var(--fg);color:var(--bg)}#err{color:#c44;min-height:1.4em}</style>
