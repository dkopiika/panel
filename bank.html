<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Банк тем</title><style>:root{--bg:#f6f5fb;--fg:#15131f;--mut:#6e6a80;--card:rgba(255,255,255,.72);--line:rgba(21,19,31,.09);
--fux:#ff2bd6;--blue:#2e5bff;--lime:#9be22d;--grey:#8d8a99;--acc:#ff2bd6;
--svob:#2e5bff;--rabota:#9be22d;--utv:#ff2bd6;--vyshla:#8d8a99;--glow:radial-gradient(1200px 500px at 90% -10%,rgba(255,43,214,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(46,91,255,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(155,226,45,.14),transparent 60%)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0d14;--fg:#f2f0fa;--mut:#9d99b0;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--lime:#b8ff4a;--rabota:#b8ff4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;padding:5px 12px;border-radius:99px;color:var(--fg);text-decoration:none;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
nav a.on{background:rgba(255,43,214,.1);color:var(--fux);border-color:rgba(255,43,214,.35)}
h1{font-size:28px;margin:.4em 0;letter-spacing:-.02em;font-weight:700}
h2{font-size:19px;margin:1.4em 0 .5em;letter-spacing:-.01em}h2 small{color:var(--mut);font-weight:500}h3{font-size:17px}
a{color:var(--blue)}code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:.88em;word-break:break-all}
blockquote{margin:1em 0;padding:.7em 1em;border-left:3px solid var(--fux);background:rgba(255,43,214,.07);border-radius:0 12px 12px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
@media (max-width:640px){table thead{display:none}table tr{display:block;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:6px 12px}
table td{display:block;border:0;padding:4px 0}table td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}
.chips button.on{background:rgba(46,91,255,.1);color:var(--blue);border-color:rgba(46,91,255,.35)}
#q{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--svob)}
.card.s-rabota::before{background:var(--rabota)}.card.s-utv::before{background:var(--utv)}.card.s-vyshla{opacity:.6}.card.s-vyshla::before{background:var(--vyshla)}
.card.s-utv{background:rgba(255,43,214,.06);border-color:rgba(255,43,214,.3)}
.card .num{font-size:12px;color:var(--mut)}.card .t{font-weight:700;margin:2px 0 6px}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--fg)}
.chip.s-svob{background:rgba(46,91,255,.15);color:var(--blue)}
.chip.s-rabota{background:rgba(155,226,45,.25);color:#3f6b00}
.chip.s-utv{background:rgba(255,43,214,.16);color:#d10fae}
.chip.s-vyshla{background:rgba(141,138,153,.18);color:var(--mut)}
.chip.f{background:rgba(46,91,255,.1);color:var(--blue)}.chip.net{background:rgba(255,80,80,.14);color:#e0304a}
@media (prefers-color-scheme:dark){.chip.s-rabota{color:var(--lime)}.chip.s-utv{color:#ff6ae4}.chip.s-svob,.chip.f{color:#7f9bff}}
.empty{color:var(--mut)}details{margin:10px 0}summary{cursor:pointer;font-weight:600}
details.txt{margin:10px 0 0;border-top:1px dashed var(--line);padding-top:8px}details.txt>summary{color:var(--fux)}
.orig,.nash{margin-top:10px;padding:10px 12px;border-radius:14px;font-size:15px}.orig{background:rgba(141,138,153,.1);border:1px solid var(--line)}.orig.none{color:var(--mut);font-size:14px}.nash{background:rgba(255,43,214,.05);border:1px solid rgba(255,43,214,.22)}.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}.nash .lbl{color:var(--fux)}.orig h2{font-size:15px;margin:.8em 0 .2em;color:var(--mut)}.nash blockquote{border-left-color:var(--blue);background:rgba(46,91,255,.06)}details.razbor>summary{color:var(--mut);font-size:14px}
.node{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:14px}.node>summary{list-style:none;display:grid;grid-template-columns:38px 1fr;gap:2px 12px;align-items:center}
.node>summary::-webkit-details-marker{display:none}
.ln-n{grid-row:span 3;width:38px;height:38px;border-radius:12px;background:rgba(255,43,214,.08);border:1px solid rgba(255,43,214,.3);color:var(--fux);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.ln-t{font-weight:600}.ln-c{font-size:13px;color:var(--mut)}.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}.bar i{display:block}
.bar i.s-svob{background:var(--svob)}.bar i.s-rabota{background:var(--rabota)}.bar i.s-utv{background:var(--utv)}.bar i.s-vyshla{background:var(--vyshla)}
.tree{list-style:none;padding:0;margin:12px 0 0;border-left:2px solid var(--line)}.tree li{padding:7px 0 7px 14px;position:relative}.tree li::before{content:"";position:absolute;left:0;top:18px;width:10px;border-top:2px solid var(--line)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.tile{display:flex;flex-direction:column;gap:4px;padding:22px;border-radius:22px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.tile:nth-child(1){border-color:rgba(255,43,214,.3)}.tile:nth-child(2){border-color:rgba(46,91,255,.3)}.tile:nth-child(3){border-color:rgba(155,226,45,.45)}
.den{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:12px 0}
.den>summary{list-style:none;display:grid;grid-template-columns:72px 1fr;gap:2px 12px;align-items:center}
.den>summary::-webkit-details-marker{display:none}
.den-d{grid-row:span 2;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;background:rgba(46,91,255,.08);border:1px solid rgba(46,91,255,.3);color:var(--blue);font-weight:700;font-size:14px;text-align:center;padding:4px}
.den-t{font-weight:600}.den-c{display:flex;gap:5px;flex-wrap:wrap}
.den[open]>summary{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.den[open] .den-d{background:rgba(255,43,214,.08);border-color:rgba(255,43,214,.35);color:var(--fux)}
.den-body>h3{font-size:22px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin:1.3em 0 .5em;color:var(--fux)}.den-body blockquote{font-size:17px;line-height:1.45;color:var(--fg)}i.viz{display:block;font-style:normal;font-size:13px;color:var(--mut);margin:-.4em 0 1em}.den-body p>b:only-child{font-size:15px;color:var(--blue)}
figure.kadr{margin:12px 0;text-align:center}figure.kadr img{max-width:100%;max-height:70vh;border-radius:14px;border:1px solid var(--line)}
figure.kadr figcaption{font-size:12px;color:var(--mut);margin-top:4px}
details.mp-tekst{margin:10px 0;border-top:1px dashed var(--line);padding-top:8px}details.mp-tekst>summary{color:var(--fux);font-size:14px}
.net-f{color:#e0304a;font-size:14px}
.tile .ic{font-size:30px}.tile small{color:var(--mut)}.sub,.upd{color:var(--mut);font-size:14px}
.km{margin:-.3em 0 1.1em}.km-o{border:1px dashed var(--line);background:transparent;color:var(--mut);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.km-f textarea{width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid rgba(46,91,255,.35);background:var(--card);color:var(--fg);font-family:inherit;font-size:15px;line-height:1.4;resize:vertical}
.km-r{display:flex;align-items:center;gap:8px;margin-top:4px}.km-mic{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:16px;cursor:pointer}
.km-mic.on{background:rgba(255,43,214,.15);border-color:var(--fux)}.km-s{font-size:12px;color:var(--mut)}
.km-blok{display:flex;gap:6px;margin:-.2em 0 .8em}.km-ok{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;cursor:pointer}
.km-ok.on{background:rgba(155,226,45,.25);border-color:#7fbf1f}
#kmbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#kmbar span{font-size:13px;color:var(--mut)}#kmsend{border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;background:var(--fux);color:#fff;cursor:pointer}
#kmsend:disabled{opacity:.6}main{padding-bottom:110px}
#lock{max-width:360px;margin:20vh auto;padding:16px;text-align:center}#lock input{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin:12px 0}
#lock button{padding:10px 20px;font-size:16px;border-radius:10px;border:0;background:var(--fg);color:var(--bg)}#err{color:#c44;min-height:1.4em}</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(p){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.v)},key,b(D.c));document.getElementById("app").innerHTML=new TextDecoder().decode(t);

try{localStorage.setItem("pk",p)}catch(e){}}
async function go(){try{window.Telegram&&Telegram.WebApp&&Telegram.WebApp.expand()}catch(e){}
